# Lägg filen i repot som: .github/workflows/bevaka.yml
name: Bevaka andelar

on:
  schedule:
    - cron: "*/5 * * * *"   # var 5:e minut (GitHubs minimum, kan bli försenad)
  workflow_dispatch:         # gör att du kan köra den manuellt från Actions-fliken

permissions:
  contents: write            # behövs för att spara andelar_seen.json tillbaka i repot

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Kolla efter nya andelsspel
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: python3 andelsbevakning.py

      - name: Spara vilka spel som setts
        run: |
          git config user.name "andelsbevakning"
          git config user.email "actions@users.noreply.github.com"
          [ -f andelar_seen.json ] || exit 0
          git add andelar_seen.json
          git diff --cached --quiet || (git commit -m "Uppdatera sedda andelar" && git push)
